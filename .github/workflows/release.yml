name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  debian-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build package
        env:
          FLUXGLASS_VERSION: ${{ github.ref_name }}
        run: |
          FLUXGLASS_VERSION="${FLUXGLASS_VERSION#v}" ./packaging/build-deb
          (cd dist && sha256sum *.deb > SHA256SUMS)
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.deb dist/SHA256SUMS --generate-notes --verify-tag
